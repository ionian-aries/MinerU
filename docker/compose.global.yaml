      - 8002:8002
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: mineru-router
    command:
      --host 0.0.0.0
      --port 8002
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  mineru-gradio:
    build:
      context: ..
